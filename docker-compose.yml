services:
  laravel:
    image: bitnami/laravel:latest
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - laravel_vendor:/app/vendor
      - .:/app
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rodagest_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPACCE_ENABLE=1
      - PHP_OPACCE_MEMORY_CONSUMPTION=128
      - PHP_OPACCE_MAX_ACCELERATED_FILES=10000
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: rodagest_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  laravel_vendor:
